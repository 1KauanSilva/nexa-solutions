<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa Solutions — Chamados</title>
  <style>
    body {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    h1, h2 {
      color: #1d4ed8;
    }

    form, article {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    label, input, textarea, select, button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 8px;
      margin-bottom: 14px;
    }

    input, textarea, select {
      padding: 10px;
      border: 1px solid #9ca3af;
      border-radius: 4px;
    }

    button {
      width: auto;
      padding: 10px 16px;
      background: #1d4ed8;
      color: white;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }

    .erro {
      color: #b91c1c;
      font-weight: bold;
    }

    .sucesso {
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Sistema de Chamados</h1>
  <p>Interface inicial da Nexa Solutions.</p>

  <section>
    <h2>Abrir chamado</h2>

    <form id="form-chamado">
      <label for="titulo">Título</label>
      <input id="titulo" name="titulo" type="text">

      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao"></textarea>

      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="ABERTO">Aberto</option>
        <option value="EM_ANDAMENTO">Em andamento</option>
        <option value="CONCLUIDO">Concluído</option>
      </select>

      <button type="submit">Cadastrar chamado</button>
    </form>

    <p id="mensagem"></p>
  </section>

  <section>
    <h2>Chamados cadastrados</h2>
    <button id="atualizar">Atualizar lista</button>
    <div id="lista-chamados"></div>
  </section>

  <script>
    const API_URL = "http://localhost:8000/api/chamados/";

    async function listarChamados() {
      const lista = document.getElementById("lista-chamados");
      lista.innerHTML = "<p>Carregando...</p>";

      try {
        const resposta = await fetch(API_URL);
        const chamados = await resposta.json();

        if (chamados.length === 0) {
          lista.innerHTML = "<p>Nenhum chamado cadastrado.</p>";
          return;
        }

        lista.innerHTML = chamados.map((chamado) => `
          <article>
            <strong>#${chamado.id} — ${chamado.titulo || "Sem título"}</strong>
            <p>${chamado.descricao || "Sem descrição"}</p>
            <p>Status: ${chamado.status}</p>
          </article>
        `).join("");
      } catch (erro) {
        lista.innerHTML = "<p class='erro'>Não foi possível consultar a API.</p>";
      }
    }

    document.getElementById("form-chamado").addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const mensagem = document.getElementById("mensagem");
      const dados = {
        titulo: document.getElementById("titulo").value,
        descricao: document.getElementById("descricao").value,
        status: document.getElementById("status").value
      };

      try {
        const resposta = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(dados)
        });

        if (!resposta.ok) {
          mensagem.className = "erro";
          mensagem.textContent = "Erro ao cadastrar chamado.";
          return;
        }

        mensagem.className = "sucesso";
        mensagem.textContent = "Chamado cadastrado com sucesso.";
        document.getElementById("form-chamado").reset();
        listarChamados();
      } catch (erro) {
        mensagem.className = "erro";
        mensagem.textContent = "A API não está disponível.";
      }
    });

    document.getElementById("atualizar").addEventListener("click", listarChamados);

    listarChamados();
  </script>
</body>
</html>
